# --- Parking Areas (zoning — B1/B2 only) ---------------------------------
# An area = a camera group within a floor (aisles + ramps). Cameras reference
# these via their `area:` field. `adjacency` = {neighbor_area_id: transit_secs}
# (gates the cross-area handoff matcher). `capacity` = physical car limit (soft
# cap on the bounded gallery). Ground floor has NO areas. Ramp areas may have
# no cameras yet. Remove this whole block to run un-zoned (legacy behaviour).
areas:
  # ── B2 floor ──
  - area_id: "B2-A"
    name: "B2 North Aisle"
    floor: B2
    capacity: 30
    adjacency: { "B2-B": 15 }
  - area_id: "B2-B"
    name: "B2 Center Aisle"
    floor: B2
    capacity: 30
    adjacency: { "B2-A": 15, "B2-C": 15 }
  - area_id: "B2-C"
    name: "B2 South Aisle"
    floor: B2
    capacity: 30
    adjacency: { "B2-B": 15, "B2-RAMP": 20 }
  - area_id: "B2-RAMP"
    name: "B2 Ramp (Up to B1)"
    floor: B2
    capacity: 6
    adjacency: { "B2-C": 20, "B1-RAMP": 30 }   # cross-floor link
  # ── B1 floor ──
  - area_id: "B1-A"
    name: "B1 North Aisle"
    floor: B1
    capacity: 30
    adjacency: { "B1-B": 15 }
  - area_id: "B1-B"
    name: "B1 Center Aisle"
    floor: B1
    capacity: 30
    adjacency: { "B1-A": 15, "B1-C": 15 }
  - area_id: "B1-C"
    name: "B1 South Aisle"
    floor: B1
    capacity: 30
    adjacency: { "B1-B": 15, "B1-RAMP": 20 }
  - area_id: "B1-RAMP"
    name: "B1 Ramp (down to B2)"
    floor: B1
    capacity: 6
    adjacency: { "B1-C": 20, "B2-RAMP": 30 }   # cross-floor link (B1 -> B2)

# --- Processing Settings ---
processing:
  mode: "round_robin"           # Process cameras one at a time in rotation
  target_fps_per_camera: 1      # Each camera gets ~1 frame/second
  stream_channel: 102           # RTSP channel: 101=main(4K), 102=sub(720p)
  per_camera_tracker: false     # DEPRECATED/ignored: detection is now always a single shared
                                # model with per-camera ByteTrack state kept inside TrackedDetector
                                # (low RAM + stable per-camera IDs, no need for N model copies).
  max_grab_fps: 0               # Cap BGR frame publication rate. The compressed RTSP
                                # stream is still drained continuously to prevent lag.
                                # 0 publishes every source frame.

# Motion is a scheduler hint only. It never changes occupancy directly.
# legacy = no motion work; shadow = measure would-be skips; enforce = gate quiet
# cameras while preserving transition frames and mandatory sentinels.
# shadow/enforce require the single-process engine and VA_SINGLE_PROCESS=1.
# Deployment overrides take precedence over YAML:
#   VA_MOTION_SCHEDULER_MODE=legacy|shadow|enforce
#   VA_SLOT_STATE_MODE=legacy|shadow|time
motion_scheduler:
  mode: legacy
  # In enforce mode this must be >= processing.target_fps_per_camera for every
  # non-bypass camera (including per-camera overrides), otherwise startup fails.
  analysis_fps: 2.0
  analysis_width: 96
  pixel_delta: 18
  changed_ratio: 0.02
  active_hold_seconds: 2.0
  sentinel_interval_seconds: 5.0
  stale_frame_seconds: 3.0
  always_infer: false            # Global emergency bypass for motion gating
  # Per-camera keys may override any numeric field above or always_infer.
  # CAM-23, CAM-03, Park_Entry, and Entrance/Entrence-zone cameras bypass gating.
  camera_overrides: {}

# --- Detector Settings ---
# Production detector is yolo11m (better recall on oblique floor angles).
# yolo11s_openvino_model is also committed as a rollback if yolo11m exceeds
# the CPU budget at 14 cameras x 1 FPS round-robin (~70 ms per camera).
detector:
  model_path: "models/yolo11m_openvino_model"  # OpenVINO IR, ~70-120 ms/frame on CPU
  confidence: 0.25                              # Low bar — parked cars in slots rarely false-positive
  classes: [2, 5, 7]                            # 2=car, 5=bus, 7=truck (SUVs/vans often classified as truck)
  imgsz: 640

  # --- Per-camera detector overrides (optional) -------------------------------
  # For cameras whose VIEW breaks the global detector. NOT DB-owned: the Config
  # table rewrites model_path/confidence/imgsz on every sync, so a per-camera
  # value stored there would be clobbered — YAML is the only home. Unset keys
  # inherit the live global value. Each DISTINCT override costs one extra model
  # load in whichever supervisor group owns the camera, so add sparingly.
  #
  # Allowed keys: model_path, confidence, imgsz, classes, max_box_area_ratio,
  # and a nested `preprocessing` block (CLAHE knobs). A typo RAISES at load
  # rather than being ignored — a silently-dropped override looks exactly like
  # the bug it was added to fix (no detections).
  #
  # Real example (the deployment's CAM-00 is a near-nadir fisheye ROOF camera;
  # the global int8 IR detects ZERO vehicles on it even at conf=0.05, while
  # scoring 0.93 on the oblique cameras beside it):
  #
  # camera_overrides:
  #   CAM-00:
  #     model_path: "models/yolo11l_openvino_model"  # int8/yolo11m collapse on fisheye
  #     max_box_area_ratio: 0.5           # drop yolo11l's whole-frame "bus"
  #     preprocessing:
  #       enabled: false                  # CLAHE erases dark cars on a SUNLIT view
  #
  # ALWAYS point model_path at an OpenVINO EXPORT DIRECTORY, never a .pt.
  # OVInferCore needs an IR .xml; given a .pt it raises FileNotFoundError and the
  # engine falls back to Ultralytics model.track() — synchronous PyTorch. Under
  # the single-process async engine that blocking call runs on the ONE shared
  # consumer thread, so one camera stalls the whole fleet. Measured in prod
  # 2026-07-20 with a .pt here: wall=11635ms (ov=11449, cpu=2533, wait=9102) per
  # frame and every camera pinned at 0.1 fps against a target of 5.
  #   yolo export model=models/yolo11l.pt format=openvino imgsz=320

  # Drop any detection covering more than this fraction of the frame. 0.0 = off.
  # Guards against a model emitting a whole-frame "car"/"bus": the slot assigner
  # matches on bottom-center point-in-polygon, so such a box can pin a slot
  # OCCUPIED forever. Set per-camera above rather than globally unless every
  # camera needs it.
  max_box_area_ratio: 0.0

  # OpenVINO CPU pool. Ultralytics hardcodes PERFORMANCE_HINT=LATENCY, which on CPU
  # caps the pool at 8 threads however many cores the box has — so a 15-core machine
  # shows only ~8 busy cores. That is a default, not saturation. 0 / "" keeps it.
  #
  # Raising it buys very little (yolo11m_320_int8, median of 11 interleaved reps, IDLE box):
  #     8 threads 11.27ms | 14 -> 11.05ms (1.02x, i.e. noise) | 16 -> 10.19ms (1.11x)
  # Run-to-run noise at a FIXED setting spans ~2.4ms, which is BIGGER than the effect —
  # so measure on the target box (tools/bench_yolo.py), idle, before trusting any value.
  # One 320px int8 inference cannot fill a wide pool. The ~2x lever is CONCURRENCY
  # (the 5 supervisor process groups), not thread width. See src/ov_tuning.py.
  #
  # Leave at 0 under the supervisor: each group is already pinned to a disjoint core
  # slice, and a global override would oversubscribe all 5 groups at once.
  ov_num_threads: 0                             # 0 = OpenVINO default (8). Try ~n_cores on a single-process box.
  ov_performance_hint: ""                       # "" = leave LATENCY. THROUGHPUT needs async/batching this loop does not do.

# --- Tracker Settings ---
tracker:
  type: "bytetrack"

# --- State Machine Settings ---
state_machine:
  confirm_enter_frames: 5
  confirm_leave_frames: 8
  # Per-camera debounce overrides, keyed by camera id. YAML-only (the two
  # counters above are DB-owned and re-synced, so a per-camera value in the DB
  # would be clobbered). Unset keys inherit the global value.
  #   camera_overrides:
  #     CAM-00:
  #       confirm_leave_frames: 16
  camera_overrides: {}
  # legacy keeps the frame counters above. shadow evaluates elapsed-time
  # hysteresis without changing public state. time makes it authoritative.
  mode: legacy
  enter_seconds: 3.0
  leave_seconds: 20.0
  enter_min_observations: 2
  leave_min_observations: 3
  # Do not expose ENTERING→VACANT or OCCUPIED→LEAVING on one missed detection.
  enter_cancel_seconds: 1.0
  enter_cancel_min_observations: 2
  leave_start_seconds: 1.0
  leave_start_min_observations: 2
  max_known_gap_seconds: 8.0

# --- Slot Assignment Settings ---
assigner:
  overlap_threshold: 0.2

  # How a vehicle is judged to be IN a slot.
  #   point    : bottom-center probe inside the polygon, with an
  #              overlap_threshold fallback. The production polygons were
  #              operator-calibrated against this — it is the safe default.
  #   coverage : the fraction of the vehicle's box inside the polygon must
  #              reach coverage_threshold. No point probe at all.
  # Switching to coverage changes slot membership at every polygon edge.
  # Validate one camera at a time on recorded footage before rolling it out,
  # and expect to re-tune coverage_threshold (and possibly redraw polygons).
  assignment_mode: point

  # Gate for assignment_mode=coverage only. NOT the same knob as
  # overlap_threshold, which gates the point-mode fallback.
  #
  # 0.30 rather than the intuitive 0.5: slot polygons are perspective
  # trapezoids and detection boxes are axis-aligned, so a car filling its slot
  # still hangs its corners outside the polygon and cannot score 1.0. On the
  # authored B1 geometry the worst slot tops out at 0.41, so a 0.5 gate leaves
  # two slots permanently VACANT with no error and no log.
  # Re-run tools/calibrate_coverage_threshold.py before raising this.
  coverage_threshold: 0.30

  # Per-camera overrides, keyed by camera id. THIS is how you roll coverage
  # mode out — one camera at a time, after validating that camera's polygons on
  # footage. YAML-only (the DB config sync would clobber it) and validated at
  # load: an unknown key or an out-of-range fraction fails startup rather than
  # leaving the camera silently on the global rule.
  # camera_overrides:
  #   CAM-05:
  #     assignment_mode: coverage
  #     coverage_threshold: 0.30

# --- Matching / ReID Decision Configuration ---
# Calibrated against the CARLA-pretrained + facility-finetuned IR
# (models/osnet_facility_carla_int8_256x128). Tool:
# tools/calibrate_thresholds_top20.py at Youden's J operating point on
# the labelled eval pairs (1095 pairs, 95 positive + 1000 negative).
# Score distribution on this IR:
#   positives: mean 0.78, p10 0.45
#   negatives: mean 0.37, p90 0.54
#   margin   : 0.41 (vs 0.17 on the previous IR)
matching:
  # ReID cosine thresholds — Youden's J operating point on the current IR
  b1_anpr: 0.45               # B1 confirmation when candidate is an ANPR crop
  b1_zone: 0.53               # B1 confirmation for Park-Entry zone crops
  b1_cross_camera: 0.41       # B1 confirmation when handing off between cams
  global_default: 0.53        # Cross-session global search
  global_with_plate: 0.44     # Same, when the session has a confirmed plate
  global_cross_camera: 0.41   # Same, when query is on a different camera
  reattach_default: 0.50      # Track→session reattach (orphan recovery)
  reattach_cross_camera: 0.41
  legacy_color_fallback: 0.35
  color_dominant_filter: 0.45

  # OCR marginal band — only relevant when plate_ocr_model is set
  ocr_marginal_low: 0.40
  ocr_marginal_high: 0.55

  # ReID-solo confirm fast-path (single-modality high-confidence)
  reid_solo_confirm: 0.68

  # HSV tolerances for the legacy color compatibility predicate
  hsv_h_tol: 12.0
  hsv_s_tol: 80.0
  hsv_v_tol: 80.0

  # Ensemble rule + temporal voting
  ensemble_min_modalities_agree: 2
  voting_enabled: true
  voting_window_frames: 3
  voting_min_agree: 2

  # Feature flags
  use_color_filter: false      # Classifier head is primary; HSV is fallback only
  use_lab_clahe: true          # Luminance normalisation under varied garage lighting
  use_multishot: true          # Average features across 3 sharpest frames per confirmation

  # ReID OpenVINO backend (production, 256x128 input, facility-finetuned INT8,
  # squash-trained — consistent train/calibration/inference preprocessing)
  use_openvino_reid: true
  reid_input_size: [256, 128]
  reid_openvino_model_dir: "models/PS_carMatching"

  # Plugin model paths — empty string disables the plugin (NoopXxx fallback)
  color_classifier_model: "models/color_classifier_openvino/model.xml"
  type_classifier_model: "models/type_classifier_openvino/model.xml"
  # Non-empty token enables the baked PaddleOCR-mobile cache. Parking-gallery
  # admission requires this; Entry V2's OCR instance is separate.
  plate_ocr_model: "enabled"

  # --- License Plate Detector (LPD) and Preprocessing ---
  slot_lpd_enabled: true               # Tight plate ROI before parked OCR
  slot_lpd_fallback_enabled: false     # LPD miss = abstain; never OCR a full car/HUD
  slot_lpd_model_dir: "models/yolo11n_lpd_openvino_model"
  slot_lpd_confidence: 0.30
  slot_lpd_iou: 0.45
  slot_lpd_num_threads: 2
  # slot_ocr_upscale: 1.0              # Super-resolution / upscaling factor for plate crop
  # slot_ocr_preprocessing: []         # Enhancement steps, applied in the order given.
                                       # Valid: clahe, sharpen, denoise, threshold.
                                       # An unrecognised name is skipped with a WARNING —
                                       # check the log if a step seems to do nothing.
  # slot_ocr_debug: false              # If true, saves debug crop images to logs/debug_ocr/

  # FAISS-CPU gallery index (enable when session count exceeds ~5000)
  use_faiss_index: false
  faiss_index_dimension: 512
  faiss_index_nlist: 8

  # Durable gallery. A valid Entry V2 session can still open at its normal
  # thresholds, but a crop reaches disk only after the stricter post-ACK entry
  # proof plus high-confidence parked OCR and unique rank-1 ReID proof.
  gallery_persist_enabled: true
  gallery_max_refs_per_car: 10
  gallery_retention_days: 0.0        # 0 = keep verified history until explicit reset
  # KEEP false UNTIL ENTRY V2 IS AUTHORITATIVE AND MINTING PROOFS.
  # Strict admission accepts a reference only with an entry_v2_parked_v1 proof.
  # Nothing but Entry V2 mints one, so with ENTRY_V2_MODE=off this closes the
  # gallery in BOTH directions: save_ref refuses the ANPR seed, the CAM-23 top
  # view, the CAM-03 B-entry reference and the learned parked pose (all pass
  # admission=None), and _active_refs hides every folder already on disk. Every
  # non-gate worker then holds no plated session, so a CORRECT slot OCR read has
  # no candidate to confirm against and current_plate stays NULL facility-wide
  # (B1, 2026-07-27: 32 correct reads of '9990BHD' discarded against "top-0 []").
  # Turning this off does NOT relax rank-1, ReID >= 0.70, margin >= 0.15,
  # sharpness, crop area, colour agreement, dedup or slot_plate_requires_ocr.
  gallery_strict_admission_enabled: false
  gallery_parked_ocr_min_confidence: 0.90
  gallery_parked_reid_min_score: 0.70
  gallery_parked_reid_min_margin: 0.15
  gallery_parked_min_neighbour_clearance: 0.90
  gallery_parked_require_rank_one: true  # mandatory in strict persistent mode
  gallery_require_slot_authority: true
  gallery_min_view_quality: 0.90

  # ── Off-session slot recovery ──────────────────────────────────────────────
  # Names a car parked inside that has NO open parking_session. Such a car is
  # invisible today, and the reason is circular: the appearance gallery is only
  # hydrated for plates that HAVE a session, so ReID holds no vectors for the one
  # car that needs them, and slot OCR then discards its own correct read for
  # naming a car "ReID has never seen" (B13 read `BHD` on 6 of 6 frames while
  # BHD-9990 appeared nowhere in the process, 2026-07-30).
  #
  # REQUIRES gallery_strict_admission_enabled: false above. With it true, all 50
  # production gallery folders yield ZERO usable references and recovery silently
  # never fires — measured, and warned about once at runtime.
  slot_recovery_enabled: false
  slot_recovery_min_score: 0.55
  slot_recovery_min_margin: 0.10
  slot_recovery_top_k: 5
  slot_recovery_cache_ttl_s: 300.0
  slot_recovery_reembed_max_refs: 3
  # ReID-ALONE tier, for slots where OCR can never corroborate. At 720p the OCR
  # witness is silent on 6 of 7 unnamed slots, so requiring two witnesses recovers
  # nothing there; this still can. Bar measured by leave-one-out over the 50
  # production identities / 782 references, cross-view:
  #     margin >= 0.10   97.2% precision, 68.3% recall
  #     margin >= 0.30   99.5%            26.9%
  #     margin >= 0.35  100.0%            15.5%   <- default
  # A wrong answer opens a session under a stranger's plate, so precision is
  # bought at whatever recall costs. The one wrong answer seen live (B7_CHRO ->
  # RZD-4976) scored margin 0.324 and is correctly refused here. 100% on 121
  # queries bounds the true error at ~2.5%, on curated crops rather than live
  # 720p slot views — treat it as "safe enough to try", not "never wrong".
  slot_recovery_solo_enabled: false
  slot_recovery_solo_min_margin: 0.35
  gallery_min_sharpness: 40.0
  gallery_min_crop_area: 12000.0
  gallery_accumulate_min_gt_similarity: 0.45

# --- Output Settings ---
output:
  log_file: ""                  # Optional: path to event log file
  show_video: false             # Show annotated video (debug only)
  show_camera: ""               # Which camera to show when show_video=true (e.g., "CAM-04")
  # Strict galleries are stored below <snapshot_base_dir>/gallery. Mount this
  # directory on persistent storage in production; Docker's relative default is
  # /app/vehicle_images.
  snapshot_base_dir: "vehicle_images"


# --- Alerting ---
# Restricted-zone alerts = named-slot intrusion (reservation_type EMPLOYEE) and
# special-needs violations (SPECIAL).
#
# HISTORY, so nobody re-mutes this by accident. This block did not exist, and
# load_config used to read ENABLE_RESTRICTED_ZONE_ALERTS with a hardcoded default
# of "false" — clobbering the code default of True. Nothing in the repo ever set
# that var, so from 2026-05-20 (a9ce2ee) every restricted-zone alert was silently
# dropped in every deployment. That commit landed a week after a false-positive
# flood (452 vehicle_intrusion alerts in the datasets; 40 on B13_COO on 2026-05-07
# alone), whose real cause was ownership being decided at vehicle_parked, when the
# plate is never known yet. The verdict is now DEFERRED until identity lands, so
# the flood cause is gone and the mute is no longer needed.
#
# The env var still wins over this file, as a deploy-time override.
alerts:
  enable_restricted_zone_alerts: true

  # How long to wait for OCR/ReID to name the occupant of a named slot before
  # giving up and raising a lower-severity `reserved_slot_unidentified` alert
  # instead of a `vehicle_intrusion` one.
  #
  # Needed because some named slots may never resolve identity: B1_CRO is listed
  # in matching.slot_no_plate_view (OCR skipped entirely — the plate is never in
  # frame, 455 attempts and zero reads), so appearance is its only witness and it
  # routinely abstains. Without this deadline that slot would have zero intrusion
  # coverage. Set to 0 to disable the fallback and alert only on a PROVEN non-owner.
  reserved_slot_identity_timeout_s: 300.0

  # Alert types kept OUT of the real-time SSE stream (/api/alerts/stream).
  # NOTIFICATION-ONLY, not a mute: report_alert still writes the row, the
  # snapshot is still saved, and /api/alerts/* still serves it. Only the live
  # push to connected dashboards is skipped.
  #
  # reserved_slot_unidentified is listed because it is the "nobody could name
  # this car" fallback above, not a proven intrusion. On a slot that can never
  # be identified (B1_CRO, see the note above) it fires on essentially every
  # occupancy, and an alert panel that is always red gets ignored. The record is
  # still there for review; it just doesn't interrupt an operator.
  #
  # Set to [] to notify on every alert type.
  suppressed_notification_types:
    - reserved_slot_unidentified

  # Alert types turned OFF entirely: no DB row, no notification. Use this (not
  # the suppression list above) to make an alert type vanish completely. Empty
  # (the default) = none disabled. Uncomment to fully drop reserved_slot_unidentified:
  # disabled_alert_types:
  #   - reserved_slot_unidentified
  disabled_alert_types: []
