# =============================================================================
# Damanat PMS Video Analytics — Multi-Camera Configuration (TEMPLATE)
# =============================================================================
# Copy this file to config.yaml and fill in the camera credentials below:
#
#     cp config.example.yaml config.yaml
#
# Defaults below mirror the verified production configuration as of
# 2026-05-17. Every model path resolves to an artifact tracked in this
# repo — no additional downloads are required for the engine to boot.
#
# Entry V2 is environment-backed rather than YAML-backed. These VA deployment
# defaults bound Hikvision/local-zone reports of one physical crossing; they are
# not evidence-expiry or business timeouts:
#
#     ENTRY_V2_PRODUCER_PAIR_MAX_SKEW_SECONDS=5.0
#     ENTRY_V2_PRODUCER_PAIR_MIN_REID_SCORE=0.95
#     ENTRY_V2_JOURNEY_CAPACITY=4096
#     VA_SINGLE_PROCESS=1
#
# Canonical CAM-23 Park_Entry or CAM-03 B1_Entrence local zones additionally
# require an explicit VA_SINGLE_PROCESS=1 deployment attestation.
# =============================================================================

database:
  DATABASE_URL: "mssql+pyodbc://USER:PASSWORD@localhost:1433/damanat_pms?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes"

# Fernet key (urlsafe-base64, 32 bytes) shared with the API Gateway to decrypt
# cameras.password_encrypted. Blank = fall back to the per-camera YAML passwords
# below. (Can also be supplied via the CAMERAS_ENCRYPTION_KEY env var.)
CAMERAS_ENCRYPTION_KEY: ""

# --- Camera Definitions ---
# The camera roster is loaded DB-first from the `cameras` table (enabled rows);
# the entries below are the YAML fallback (used when that table is absent/empty)
# and the password source while CAMERAS_ENCRYPTION_KEY is still blank.
# Each camera has: id, name, floor, RTSP credentials, slots polygon file.
# Ground-floor cameras (CAM-01, CAM-02) are still listed even though they
# do not participate in slot detection — they are the outdoor ANPR-bound
# cameras that feed the entrance flow.
#
# `area:` (zoning, B1/B2 only) assigns a camera to one parking area defined in
